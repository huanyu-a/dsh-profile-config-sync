url: https://github.com/huanyu-a/dsh-profile-config-sync
name: huanyu-a/dsh-profile-config-sync
category: git
description:
  en: 'Sync your DSH setup across machines and operating systems: see at a glance how this machine differs from the cloud config repo — changed files, commits ahead or behind, sessions and skills not synced yet — then generate the push, pull and restore scripts that run after the client exits. Runs on Windows (PowerShell), macOS and Linux (Node engine), and can use WebDAV instead of git. A pull blocked by local edits keeps both sides and lets you pick per file; every apply snapshots the profile first, and config snapshots, plugin backups and session backups all restore in one click, including rolling back a broken plugin install.'
  zh: '多机、跨系统 DSH 配置同步：本机与云端仓库的差异一眼看清——改了哪些文件、提交领先还是落后、哪些会话和技能还没同步，一键生成退出后执行的推送、拉取、还原脚本。支持 Windows（PowerShell）、macOS 与 Linux（Node 引擎），并可用 WebDAV 代替 git。拉取撞上本地改动时两侧都留底、逐项选保留哪边；每次应用前自动备份，配置快照、插件备份、会话备份都能一键还原，装坏的插件也能整份回滚。'
icon: https://raw.githubusercontent.com/huanyu-a/dsh-profile-config-sync/main/docs/icon-180.png